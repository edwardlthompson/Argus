name: pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["argus-weekly", "argus-scan"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Generate status-only site (dry-run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: argus run --dry-run --no-notify || true
      - name: Stage public status page only
        run: |
          mkdir -p _site
          # Never publish report.html / runbook.md / inbox.json to public Pages.
          if [ -f dist/status.html ]; then
            cp dist/status.html _site/index.html
          fi
          if [ -f dist/status.json ]; then
            cp dist/status.json _site/status.json
          fi
          if [ ! -f _site/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><html><body><h1>Argus</h1><p>No status yet. Run the scan or weekly workflow.</p></body></html>' > _site/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
