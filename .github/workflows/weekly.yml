name: argus-weekly

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Set true to allow non-dry-run auto-apply"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Doctor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: argus doctor || true
      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGUS_DISCORD_WEBHOOK: ${{ secrets.ARGUS_DISCORD_WEBHOOK }}
          ARGUS_TELEGRAM_BOT_TOKEN: ${{ secrets.ARGUS_TELEGRAM_BOT_TOKEN }}
          ARGUS_TELEGRAM_CHAT_ID: ${{ secrets.ARGUS_TELEGRAM_CHAT_ID }}
          ARGUS_WEBHOOK_URL: ${{ secrets.ARGUS_WEBHOOK_URL }}
          ARGUS_REPORT_URL: ${{ vars.ARGUS_REPORT_URL }}
        run: |
          REPORT_FLAG=""
          if [ -n "$ARGUS_REPORT_URL" ]; then REPORT_FLAG="--report-url $ARGUS_REPORT_URL"; fi
          if [ "${{ inputs.apply }}" = "true" ]; then
            argus run --apply $REPORT_FLAG
          else
            argus run --dry-run $REPORT_FLAG
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-dist
          path: dist/
