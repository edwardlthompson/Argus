name: argus-weekly

on:
  schedule:
    # Tuesday after Monday Dependabot: YOLO maintenance (fix/merge upgrades + patches).
    - cron: "0 14 * * 2" # Tuesdays 14:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "true=apply, false=dry-run, empty=respect safety.yaml (YOLO implies apply)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Doctor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: argus doctor || true
      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGUS_GITHUB_TOKEN: ${{ secrets.ARGUS_GITHUB_TOKEN }}
          ARGUS_DISCORD_WEBHOOK: ${{ secrets.ARGUS_DISCORD_WEBHOOK }}
          ARGUS_TELEGRAM_BOT_TOKEN: ${{ secrets.ARGUS_TELEGRAM_BOT_TOKEN }}
          ARGUS_TELEGRAM_CHAT_ID: ${{ secrets.ARGUS_TELEGRAM_CHAT_ID }}
          ARGUS_WEBHOOK_URL: ${{ secrets.ARGUS_WEBHOOK_URL }}
          ARGUS_REPORT_URL: ${{ vars.ARGUS_REPORT_URL }}
        run: |
          if [ -n "$ARGUS_GITHUB_TOKEN" ]; then
            export GITHUB_TOKEN="$ARGUS_GITHUB_TOKEN"
          fi
          REPORT_FLAG=""
          if [ -n "$ARGUS_REPORT_URL" ]; then REPORT_FLAG="--report-url $ARGUS_REPORT_URL"; fi
          APPLY="${{ inputs.apply }}"
          if [ "$APPLY" = "true" ]; then
            argus run --apply $REPORT_FLAG
          elif [ "$APPLY" = "false" ]; then
            argus run --dry-run $REPORT_FLAG
          else
            # schedule / unset: YOLO implies apply (docs/YOLO.md)
            argus run $REPORT_FLAG
          fi
      - name: Upload private artifacts
        uses: actions/upload-artifact@v7
        with:
          name: argus-dist
          path: dist/
          retention-days: 30
      - name: Ping Tuesday Steward (optional Grok webhook)
        env:
          GROK_STEWARD_WEBHOOK_URL: ${{ secrets.GROK_STEWARD_WEBHOOK_URL }}
          GROK_STEWARD_WEBHOOK_KEY: ${{ secrets.GROK_STEWARD_WEBHOOK_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GROK_STEWARD_WEBHOOK_URL:-}" ]; then
            echo "GROK_STEWARD_WEBHOOK_URL unset — skip Steward ping"
            exit 0
          fi
          BODY=$(python - <<'PY'
          import json, pathlib
          d = pathlib.Path("dist")
          payload = {
            "event": "after-argus-weekly",
            "artifacts": {
              "health_delta": (d / "health-delta.md").exists(),
              "health_hotspots": (d / "health-hotspots.json").exists(),
              "health_infographic": (d / "health-infographic.svg").exists(),
            },
            "instruction": (
              "Run Tuesday Steward portfolio digest. Prefer health-delta.md, "
              "health-hotspots.json, and health-infographic.svg from this run."
            ),
          }
          print(json.dumps(payload))
          PY
          )
          HDR=(-H "Content-Type: application/json")
          if [ -n "${GROK_STEWARD_WEBHOOK_KEY:-}" ]; then
            HDR+=(-H "Authorization: Bearer ${GROK_STEWARD_WEBHOOK_KEY}")
          fi
          curl -fsS -X POST "${GROK_STEWARD_WEBHOOK_URL}" "${HDR[@]}" -d "$BODY" || true
