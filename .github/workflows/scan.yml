name: argus-scan

# Start a scan from GitHub UI / mobile Actions (workflow_dispatch).
# Full report stays in private artifacts; public Pages get status-only counts.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set true to allow non-dry-run auto-apply + Issues sync writes"
        required: false
        default: "false"
      notify:
        description: "Send chat digests when human work exists"
        required: false
        default: "true"
  repository_dispatch:
    types: [argus-scan]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGUS_GITHUB_TOKEN: ${{ secrets.ARGUS_GITHUB_TOKEN }}
          ARGUS_DISCORD_WEBHOOK: ${{ secrets.ARGUS_DISCORD_WEBHOOK }}
          ARGUS_TELEGRAM_BOT_TOKEN: ${{ secrets.ARGUS_TELEGRAM_BOT_TOKEN }}
          ARGUS_TELEGRAM_CHAT_ID: ${{ secrets.ARGUS_TELEGRAM_CHAT_ID }}
          ARGUS_WEBHOOK_URL: ${{ secrets.ARGUS_WEBHOOK_URL }}
          ARGUS_REPORT_URL: ${{ vars.ARGUS_REPORT_URL }}
        run: |
          if [ -n "$ARGUS_GITHUB_TOKEN" ]; then
            export GITHUB_TOKEN="$ARGUS_GITHUB_TOKEN"
          fi
          REPORT_FLAG=""
          if [ -n "$ARGUS_REPORT_URL" ]; then REPORT_FLAG="--report-url $ARGUS_REPORT_URL"; fi
          # workflow_dispatch inputs; repository_dispatch defaults to dry-run unless client_payload.apply=true
          APPLY="${{ inputs.apply }}"
          NOTIFY="${{ inputs.notify }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            APPLY="${{ github.event.client_payload.apply }}"
            NOTIFY="${{ github.event.client_payload.notify }}"
            APPLY="${APPLY:-false}"
            NOTIFY="${NOTIFY:-true}"
          fi
          NOTIFY_FLAG=""
          if [ "$NOTIFY" != "true" ]; then NOTIFY_FLAG="--no-notify"; fi
          if [ "$APPLY" = "true" ]; then
            argus run --apply $REPORT_FLAG $NOTIFY_FLAG
          elif [ "$APPLY" = "false" ]; then
            argus run --dry-run $REPORT_FLAG $NOTIFY_FLAG
          else
            # unset: respect safety.yaml (YOLO implies apply)
            argus run $REPORT_FLAG $NOTIFY_FLAG
          fi
      - name: Upload private artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-scan-dist
          path: dist/
          retention-days: 30
