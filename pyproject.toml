[project]
name = "argus"
version = "0.9.0"
description = "One controller to rule them all — multi-repo hygiene, scoring, safe auto-apply, and gated agentic execution."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Argus contributors" }]
keywords = ["github", "hygiene", "controller", "automation"]
dependencies = [
  "click>=8.5.1",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "jsonschema>=4.26.0",
  "pyyaml>=6.0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.5",
]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
