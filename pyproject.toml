[project]
name = "argus"
version = "0.3.0"
description = "One controller to rule them all — multi-repo hygiene, scoring, safe auto-apply, and gated agentic execution."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Argus contributors" }]
keywords = ["github", "hygiene", "controller", "automation"]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
