# Operator voice for the public GitHub profile Overview (USERNAME/USERNAME).
# Live languages/topics/projects come from the API — do not invent achievements here.
enabled: true
tagline: "Building useful, maintainable tools."
about: |
  I build software that turns messy workflows into systems people can run, monitor, and improve.
roles:
  - title: Problem Solver
    blurb: Turning complex workflows into clear solutions.
  - title: Builder
    blurb: Creating tools people can use every day.
  - title: Automator
    blurb: Removing repetitive work and saving time.
capabilities:
  - title: Automation Systems
    blurb: Scheduled work, validation, sync, and background processing.
  - title: Web & API Development
    blurb: Maintainable backends and clean integrations.
  - title: Internal Tools
    blurb: Ops, auditing, configuration, and access-friendly admin surfaces.
principles: >
  Build for real users. Protect data integrity. Automate repetitive work.
  Keep interfaces understandable. Prefer maintainable solutions.
open_to: "Software development, internal tools, automation, and technical collaborations."
max_languages: 8
# Featured = public non-fork repos ranked by stars, then traffic (views+clones). Not attention score.
max_featured_repos: 6
include_badges: true
# App icons: Argus looks for icon.png / logo.png / fastlane icon / etc.; else Open Graph image.
