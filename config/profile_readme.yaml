# Operator voice for the public GitHub profile Overview (USERNAME/USERNAME).
# New operators: start from config/profile_readme.yaml.example (see docs/PROFILE_OVERVIEW.md).
# Live languages/projects come from the API — do not invent achievements here.
# Empty roles/capabilities → Argus auto-fills from config/profile_skills.yaml.
enabled: true
tagline: "Building clean, secure, maintainable apps."
about: |
  Software developer from Puerto Rico. I turn messy workflows into systems
  people can run, monitor, and improve — a living portfolio of skills across
  automation, Android/desktop apps, and FOSS tooling.
roles: []
capabilities: []
principles: >
  Build for real users. Protect data integrity. Automate repetitive work.
  Prefer FOSS, local-first, and maintainable solutions.
# Curated flagships (short name or owner/name). Empty → popularity sum only.
featured_repos: []
# Optional https icon URLs when repos lack a discoverable PNG mark.
icon_overrides: {}
# Footer attribution on the Overview (this product's public repo).
argus_repo: edwardlthompson/Argus
current_focus:
  - title: Portfolio hygiene
    blurb: Keeping public Overview and FOSS apps aligned with live evidence via Argus.
  - title: Local-first apps
    blurb: Android and desktop tools that respect privacy and work offline.
# Card grid for collaborations (overrides plain open_to string when non-empty).
open_to_cards:
  - title: Software development
    blurb: Practical builds across automation, apps, and FOSS tooling.
  - title: Automation
    blurb: Scheduled systems, bots, CI, and workflow cleanup.
  - title: FOSS collaboration
    blurb: Issues, PRs, and shared maintainership on MIT-licensed work.
  - title: Clean secure apps
    blurb: Local vaults, clear UX, and maintainable architecture.
open_to: "Software development, automation, FOSS collaboration, and clean secure apps."
# Optional contact (never scraped from secrets). GitHub profile badge always shown when include_badges.
# email: ""
max_languages: 8
# 0 = every eligible public project including forks (curated list still leads).
max_featured_repos: 0
featured_columns: 7
featured_icon_size: 64
include_badges: true
show_featured_stars: false
show_featured_stats: true
show_profile_views: true
# Self-hosted muted Primer Octicons (written to YOU/YOU assets/octicons/ on profile PR).
# Override paths only if you relocate assets:
# octicon_star: ./assets/octicons/star-16.svg
# octicon_watch: ./assets/octicons/eye-16.svg
# octicon_fork: ./assets/octicons/repo-forked-16.svg
# octicon_views: ./assets/octicons/pulse-16.svg
banner_carries_identity: true
featured_card_width: 280
# Showcase: N columns, adaptive rows; short last rows are center-padded.
# Icons: config/profile_icons.yaml · docs/PROFILE_ICONS.md (hygiene BRAND-ICON-MISSING).
# Banner: Argus generates assets/argus-banner.svg in the profile PR.
# Drop-in: replace that file in YOU/YOU (e.g. from ryme.md or profile-signal-kit) — Argus keeps it if unchanged and README still needs update; regenerates when opening a refresh PR unless you stop PROF-README.
