notify_on_human_work: true
notify_on_critical_security: true
notify_on_run_error: true
critical_security_threshold: 80
# Digests use counts + Issue/Actions links only (no CVE / per-repo security names).
notify_include_repo_names: false
# Quiet hours (local timezone name). Empty = always allow.
quiet_hours:
  enabled: false
  timezone: UTC
  start_hour: 22
  end_hour: 8
# Coalesce: skip if a digest was sent within this many hours.
digest_coalesce_hours: 24

# Prefer env secrets over committing URLs:
#   ARGUS_DISCORD_WEBHOOK
#   ARGUS_TELEGRAM_BOT_TOKEN + ARGUS_TELEGRAM_CHAT_ID
#   ARGUS_WEBHOOK_URL
#   ARGUS_REPORT_URL  (public status page URL — counts only)

discord:
  enabled: false
  webhook_url: ""

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""

webhook:
  enabled: false
  url: ""

email:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  use_tls: true
  username: ""
  password: ""
  from: ""
  to: ""
  subject: "Argus needs you"
